[package]
name = "pink-prose-frontend"
description = "Pink Prose web frontend"
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
publish = false

[dependencies]
actix-web = { workspace = true, optional = true }
leptos = { workspace = true }
leptos-actix = { workspace = true, optional = true }
leptos-meta = { workspace = true }
leptos-router = { workspace = true }

[features]
backend = [
	"dep:actix-web",
	"dep:leptos-actix",
	"leptos/ssr",
	"leptos-meta/ssr",
	"leptos-router/ssr"
]
frontend = [
	"leptos/hydrate"
]

[lints]
workspace = true
